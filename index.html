<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Gallery</title>
<style>
  :root {
    --bg: #fbf6f4; --panel: #ffffff; --text: #2b2023; --muted: #7d6b70;
    --line: #ecdcd8; --accent: #c8463a; --accent-text: #ffffff; --chip: #f4e8e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1719; --panel: #262022; --text: #f2e9e7; --muted: #a8979b;
      --line: #3a3033; --accent: #ef7a68; --accent-text: #1c1719; --chip: #322a2c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 14px 16px 10px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .hint { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
  .row .label { color: var(--muted); font-size: 12px; width: 64px; }
  button.chip { border: 1px solid var(--line); background: var(--chip); color: var(--text);
                border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  main { padding: 8px 16px 48px; }
  section h2 { font-size: 15px; margin: 22px 0 8px; text-transform: capitalize; }
  section h2 span { color: var(--muted); font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: 8px; }
  .icon { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
          cursor: pointer; text-align: center; font: inherit; color: var(--muted); font-size: 12px; }
  .icon:hover, .icon:focus-visible { border-color: var(--accent); outline: none; }
  .icon img { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 4px; margin-bottom: 4px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
           transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Icon Gallery</h1>
  <p class="hint">Click an icon to copy it. AO3 code is ready to paste into the HTML editor.</p>
  <div class="row" id="chars"><span class="label">Character</span></div>
  <div class="row" id="sizes"><span class="label">Size</span></div>
  <div class="row" id="formats"><span class="label">Copy as</span></div>
  <div class="row" id="emotions"><span class="label">Emotion</span></div>
</div></header>
<main class="wrap" id="gallery"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = {"konoko":[["smug",["162"]],["flushed",["47","48","49","61","120"]],["malcontent",["13","21","22","23","26","35","36","37","38","40","41","42","43","50","53","54","55","60","65","71","74","77","79","84","92","96","97","103","105","138","141","142","143","144","169","173","174","175","176","177","178","179","180","181","191","198","206","210","213","214","215","216","218","219","220","221","223","224"]],["sad",["12","27","29","90","140","158"]],["shocked",["56","57","69","70","73","80","85","100","172","183","187","194","195","196","209","217"]],["skeptical",["6","11","17","18","24","25","31","34","46","67","68","76","78","81","82","83","88","94","114","115","124","125","128","129","137","139","145","147","152","155","156","165","166","167","168","182","184","185","189","190","192"]],["smile",["51","75"]],["speaking",["2","7","8","9","10","14","15","16","19","20","30","32","39","44","66","72","98","99","101","106","111","112","117","118","119","123","127","130","131","132","133","136","146","148","151","157","161","163","170","171","186","193","199","201","202","208","212"]],["staring",["1","3","4","28","33","45","52","58","62","63","86","87","89","93","95","104","110","113","116","122","126","135","149","150","153","154","159","160","164","188","197","200","203","204","205","207","211","222"]],["thinking",["5","59","64","91","102","107","108","109","121","134"]]],"spierce":[["smile",["1","8","10","11","14","15","16","21","24","25","26","27","33","45","47","53","54","55","57","71","83","103","109","112","125","131","132","140","143","150","151","157","164","173","182","192","194","200","204","222","228","231","239","242","247","248","257","266","281","286","288","290","300","303","307","310","312","317","320","326","330","334","336","347","350","357","362","368","369","370","374","380","390","391","394","400","409","410","411","413","414","419","421","426","432","434","435","439","440","442","449","453","467","472","475","479","480","483","484","488","490","493","494","495","502","507","509","510","512","517","518","521","522","524","528","531","540","541","542","547","551","552","558","561","563","566","567","570","572","574","582","583","594","598","601","606","610","614","655","705","745","779","783","784","788","794","798","803","804","805","809","810","821","847","851","857","886","895","908","928","940","997"]],["concerned",["2","5","17","40","44","113","739","747","765","780","781","782","785","890","919"]],["smug",["3","4","29","72","78","137","305","580","653","664","678","686","687","735","766","778","790","800","801","811","830","843"]],["speaking",["6","7","12","13","18","19","20","34","35","37","43","46","59","60","66","70","79","80","81","84","95","98","102","106","115","116","117","119","120","124","138","144","152","153","154","159","167","169","176","177","193","214","246","249","267","268","271","302","324","331","339","345","346","376","381","382","387","397","415","420","446","462","476","481","482","496","501","508","520","529","530","535","545","573","581","586","599","604","723","730","746","775","846","849","852","853","854","855","858","859","860","861","865","867","871","872","873","874","880","881","884","885","887","889","900","906","910","925","966","976","990","994","998"]],["thinking",["9","32","36","58","67","69","90","91","100","111","196","260","273","282","293","319","325","332","393","513","605","839","840","841","862","863","864","868","869","870","875","876","877","879","882","883","892","894","901","902","905","909","913","917","923","924","926","927","929","930","938","960","967","982","984"]],["uncomfortable",["22","61","62","63","65","75","160","168","171","195","199","207","210","277","280","283","328","337","342","343","349","353","354","358","359","360","361","366","367","377","385","398","403","408","425","451","457","458","460","465","498","534","546","562","565","568","596","638","659","675","681","682","685","690","693","694","721","743","744","750","751","752","753","757","768","772","773","774","789","793","802","807","808","812","816","817","818","819","822","824","826","827","828","832","833","834","835","899","914","942","965","985"]],["shocked",["23","38","51","56","64","77","86","88","92","93","96","108","118","122","123","127","135","136","139","145","148","163","165","166","172","184","187","201","205","211","213","217","218","221","224","226","233","234","235","240","244","245","251","252","253","254","255","258","264","265","269","275","276","279","287","289","291","297","311","313","315","318","327","335","348","356","365","375","383","384","389","395","402","404","405","407","416","423","428","429","437","438","445","464","469","470","473","474","485","489","497","504","514","533","543","549","550","556","557","559","569","577","600","603","608","612","616","626","627","628","629","636","637","641","646","651","658","660","663","672","676","698","699","700","703","724","733","740","742","748","755","756","760","761","762","767","776","777","786","795","796","799","836","893","896","918","922","931","932","934","935","946","948","949","950","954","959","961","974","977","988","991"]],["malcontent",["28","30","31","41","42","48","49","74","94","99","101","104","107","110","114","126","130","142","146","147","149","155","156","161","170","174","175","178","183","186","190","191","202","203","208","209","219","220","223","236","237","241","243","250","259","263","272","274","292","299","304","306","309","316","321","329","341","352","355","378","379","388","392","401","424","463","478","486","491","499","503","506","511","526","527","548","571","575","578","585","587","591","597","602","619","621","622","623","624","625","630","634","648","650","652","654","656","657","665","669","670","673","680","684","688","691","692","695","702","704","708","710","711","712","713","714","715","716","717","718","719","720","725","726","732","741","769","770","771","792","806","820","823","829","831","842","844","848","891","898","907","915","916","920","921","937","939","951","953","955","956","957","958","962","963","970","978","983","992"]],["flushed",["39","50","76","87","121","162","180","181","197","198","206","225","229","230","238","256","262","270","278","284","294","298","314","322","323","340","351","371","373","386","396","399","406","417","418","422","431","436","441","450","477","515","519","525","544","554","576","579","584","588","589","590","592","593","607","617","620","631","632","633","643","647","662","668","671","674","683","689","697","701","706","707","709","759","763","897","944","945","952","964","969","971","972","973","975","979","987","996"]],["skeptical",["52","82","85","89","97","105","128","129","133","134","141","188","215","227","232","285","295","296","308","639","642","813","911","936"]],["sad",["68","185","212","216","363","364","412","427","430","443","444","447","448","452","454","455","456","459","461","466","468","471","487","492","505","532","536","537","539","553","555","560","618","635","644","649","661","666","667","677","850","933","941","943","947","968","980","986","993"]],["staring",["73","158","179","189","261","301","333","338","372","433","500","516","523","538","564","595","609","611","613","615","640","645","679","696","722","727","728","729","731","734","736","737","738","749","754","758","764","787","791","797","814","815","825","837","838","845","856","866","878","888","903","904","912","981","989","995","1000","1001"]],["action",["999","1002"]]]};
const SIZES = ["100x100", "150x150"];
const FORMATS = { 'AO3 code': 'html', 'Link only': 'url' };
const state = { char: Object.keys(DATA)[0], size: SIZES[0], format: 'html', emotion: 'all' };
try { Object.assign(state, JSON.parse(localStorage.getItem('iconGallery') || '{}')); } catch (e) {}
if (!DATA[state.char]) state.char = Object.keys(DATA)[0];
if (!SIZES.includes(state.size)) state.size = SIZES[0];

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const px = size => parseInt(size, 10);

function chips(id, items, current, set) {
  const row = document.getElementById(id);
  row.querySelectorAll('button').forEach(b => b.remove());
  for (const [label, value] of items) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label;
    b.setAttribute('aria-pressed', value === current);
    b.onclick = () => { set(value); save(); render(); };
    row.appendChild(b);
  }
}

function save() { try { localStorage.setItem('iconGallery', JSON.stringify(state)); } catch (e) {} }

function iconPath(emotion, name) {
  return [state.char, state.size, emotion, name + '.png'].filter(Boolean).map(encodeURIComponent).join('/');
}

function copyText(emotion, name) {
  const url = new URL(iconPath(emotion, name), location.href).href;
  if (state.format === 'url') return url;
  const n = px(state.size);
  const alt = cap(state.char) + (emotion ? ', ' + emotion : '');
  return `<img src="${url}" width="${n}" height="${n}" alt="${alt}" />`;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copy(emotion, name) {
  const text = copyText(emotion, name);
  try { await navigator.clipboard.writeText(text); toast('Copied ' + name + (emotion ? ' (' + emotion + ')' : '')); }
  catch (e) { prompt('Copy this:', text); }
}

function render() {
  const groups = DATA[state.char];
  if (state.emotion !== 'all' && !groups.some(g => g[0] === state.emotion)) state.emotion = 'all';
  chips('chars', Object.keys(DATA).map(c => [cap(c), c]), state.char, v => state.char = v);
  chips('sizes', SIZES.map(s => [s, s]), state.size, v => state.size = v);
  chips('formats', Object.entries(FORMATS), state.format, v => state.format = v);
  chips('emotions', [['All', 'all'], ...groups.map(([e]) => [e ? cap(e) : 'Unsorted', e])], state.emotion,
        v => state.emotion = v);

  const gallery = document.getElementById('gallery');
  gallery.style.setProperty('--cell', (px(state.size) + 14) + 'px');
  gallery.replaceChildren();
  for (const [emotion, names] of groups) {
    if (state.emotion !== 'all' && state.emotion !== emotion) continue;
    const sec = document.createElement('section');
    const h = document.createElement('h2');
    h.textContent = emotion || 'Unsorted';
    const count = document.createElement('span'); count.textContent = ' · ' + names.length;
    h.appendChild(count);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const name of names) {
      const b = document.createElement('button'); b.className = 'icon';
      b.title = 'Copy ' + name;
      const img = document.createElement('img');
      img.src = iconPath(emotion, name); img.alt = cap(state.char) + (emotion ? ', ' + emotion : '');
      img.loading = 'lazy'; img.width = px(state.size); img.height = px(state.size);
      b.append(img, name);
      b.onclick = () => copy(emotion, name);
      grid.appendChild(b);
    }
    sec.append(h, grid);
    gallery.appendChild(sec);
  }
}
render();
</script>
</body>
</html>
